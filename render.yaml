services:
  - type: web
    name: jshen-card-prediction-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx wrangler dev --config dist/server/wrangler.json --ip 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
